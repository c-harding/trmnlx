services:
  trmnl:
    env_file:
      - ./.env
    # Inside the container the server always listens on 7777. SERVER_PORT in .env only picks the
    # port on the host, which Caddy forwards to.
    # SETUP_ENABLED comes from the shell only (scripts/pair turns it on, scripts/deploy forces it off),
    # overriding any value in .env.
    environment:
      - SERVER_PORT=7777
      - SETUP_ENABLED=${SETUP_ENABLED:-0}
    restart: always
    # The build cache is stored inside the image (inline cache), and the next build reads it from
    # there. So `docker system prune` emptying the build cache, by any project's deploy, doesn't
    # make the next build run every step again.
    image: trmnlx
    build:
      context: .
      cache_from:
        - trmnlx
      args:
        BUILDKIT_INLINE_CACHE: 1
        ENV_HASH: ${ENV_HASH:-}
      # For the build's config check (see Dockerfile)
      secrets:
        - env
    # Bound to localhost only: Caddy on the host provides HTTPS, and nothing should reach the
    # server over plain HTTP from outside.
    ports:
      - '127.0.0.1:${SERVER_PORT:-7777}:7777'
    # Devices' playlist positions, check-ins and telemetry (see src/state-file.ts), kept across
    # deploys and restarts
    volumes:
      - state:/usr/src/app/state

secrets:
  env:
    file: ./.env

volumes:
  state:
