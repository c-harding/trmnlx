# Checks every push and pull request: types, tests and formatting
name: Check

on:
  push:
  pull_request:

# The token can only read: the job needs nothing more
permissions:
  contents: read

# A new push to a pull request cancels its run still going, as only the latest counts
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run format:check
